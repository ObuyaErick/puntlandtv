name: puntland
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  material_ui: ^1.1.0
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  go_router: ^18.0.0
  dio: ^5.11.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.5
  cached_network_image: ^4.0.0
  connectivity_plus: ^7.3.1
  video_player: ^2.14.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  flutter_widget_from_html_core: ^0.17.3
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  json_serializable: ^6.14.1
  riverpod: ^3.4.2

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/fixtures/

  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: SourceSerif4
      fonts:
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Semibold.ttf
          weight: 600
        - asset: assets/fonts/SourceSerif4-Bold.ttf
          weight: 700
