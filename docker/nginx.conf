# Serves one compiled Flutter web app. Both containers use this file unchanged;
# they differ only in what was compiled into /usr/share/nginx/html.
#
# 8080 rather than 80 so nothing in the container needs a privileged port. The
# published port is chosen in docker-compose.yml (3002 / 3003).

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter's web output is not content-hashed: `main.dart.js` keeps its name
    # from build to build, and so do canvaskit.wasm and every file under
    # assets/. A long max-age anywhere in here therefore serves yesterday's app
    # after a deploy, with no URL change to break the cache.
    #
    # `no-cache` does not mean "don't store" — the browser still keeps the file
    # and still skips the download; it just has to revalidate, and nginx answers
    # from the ETag with a 304. The cost is one conditional request per asset,
    # which is the right trade for a build that reuses filenames.
    etag on;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        application/manifest+json
        image/svg+xml
        font/ttf
        font/woff
        font/woff2;

    # For the compose healthcheck. Above the SPA fallback, or it would be
    # answered with index.html and pass no matter what.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The console calls `usePathUrlStrategy()`, so /articles/42 is a real URL
    # the browser will request from us on a reload or a pasted link. There is no
    # such file — hand every unmatched path to the app and let go_router read it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
