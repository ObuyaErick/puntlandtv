<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="puntland">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>puntland</title>
  <link rel="manifest" href="manifest.json">

  <!--
    hls.js — live TV playback on the web.

    On web, `video_player` is a plain <video> element, and only Safari can play
    an .m3u8 from one. Chrome and Firefox need the manifest parsed and the
    segments fed to the element in JavaScript. Both the reader app and the
    console ship web builds, so without this the live channel simply does not
    play for most of the desktop audience or for any console operator.

    Loaded here rather than bundled because it is a browser-only dependency
    that the mobile builds must not carry, and `lib/core/playback/
    web_hls_video_engine.dart` reads it off the global as `Hls`. That engine
    checks the global exists and reports PLAYBACK_FAILED rather than spinning
    forever if this tag is ever blocked or removed.

    Pinned to an exact version: a player that silently changes version between
    deploys is not something to discover during a broadcast.
  -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
